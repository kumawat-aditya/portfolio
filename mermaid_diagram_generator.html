<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  #app {
    background: #09090b;
    /* Zinc 950 */
    min-height: 100vh;
    font-family: 'Space Grotesk', sans-serif;
    color: #f4f4f5;
    /* Zinc 100 */
    display: flex;
    flex-direction: column;
  }

  .header {
    border-bottom: 1px solid #27272a;
    /* Zinc 800 */
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: #09090b;
  }

  .header-logo {
    width: 32px;
    height: 32px;
    background: #18181b;
    border: 1px solid #3f3f46;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  .header-title {
    font-size: 16px;
    font-weight: 500;
    color: #e4e4e7;
    letter-spacing: -0.2px;
  }

  .header-badge {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    color: #a1a1aa;
    border: 1px solid #27272a;
    border-radius: 4px;
    padding: 3px 8px;
    text-transform: uppercase;
  }

  .workspace {
    display: grid;
    grid-template-columns: 400px 1fr;
    flex: 1;
    min-height: 0;
  }

  .panel-left {
    background: #09090b;
    border-right: 1px solid #27272a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .panel-section {
    padding: 18px 20px 14px;
    border-bottom: 1px solid #18181b;
  }

  .panel-label {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #71717a;
    /* Zinc 500 */
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .template-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .tpl-btn {
    background: #121214;
    border: 1px solid #27272a;
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
  }

  .tpl-btn:hover {
    background: #18181b;
    border-color: #3f3f46;
  }

  .tpl-btn.active {
    background: #18181b;
    border-color: #f4f4f5;
    box-shadow: 0 0 0 1px #f4f4f5;
  }

  .tpl-name {
    font-size: 12px;
    font-weight: 500;
    color: #e4e4e7;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tpl-type {
    font-size: 10px;
    color: #71717a;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  .editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 18px 20px;
  }

  #editor {
    flex: 1;
    background: #09090b;
    border: 1px solid #27272a;
    border-radius: 8px;
    color: #d4d4d8;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    line-height: 1.6;
    padding: 16px;
    resize: none;
    outline: none;
    min-height: 260px;
    tab-size: 2;
    transition: border-color 0.2s;
  }

  #editor:focus {
    border-color: #52525b;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .btn-primary {
    flex: 1;
    background: #f4f4f5;
    /* Off-white premium look */
    border: 1px solid #ffffff;
    border-radius: 6px;
    color: #09090b;
    /* Dark text */
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    transition: all 0.15s ease;
  }

  .btn-primary:hover {
    background: #e4e4e7;
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: scale(0.98);
  }

  .btn-secondary {
    background: #121214;
    border: 1px solid #27272a;
    border-radius: 6px;
    color: #a1a1aa;
    font-size: 12px;
    padding: 10px 14px;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .btn-secondary:hover {
    background: #18181b;
    border-color: #3f3f46;
    color: #f4f4f5;
  }

  .panel-right {
    background: #09090b;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    background-image: radial-gradient(#18181b 1px, transparent 1px);
    background-size: 24px 24px;
  }

  .preview-toolbar {
    background: rgba(9, 9, 11, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid #27272a;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .preview-status {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
  }

  .status-dot.error {
    background: #ef4444;
  }

  .status-dot.loading {
    background: #f59e0b;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {

    0%,
    100% {
      opacity: 1;
    }

    50% {
      opacity: 0.4;
    }
  }

  .status-text {
    font-size: 12px;
    color: #71717a;
    font-family: 'JetBrains Mono', monospace;
  }

  .toolbar-actions,
  .zoom-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .icon-btn {
    background: #121214;
    border: 1px solid #27272a;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 11px;
    color: #a1a1aa;
    transition: all 0.15s ease;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
  }

  .icon-btn:hover {
    background: #18181b;
    border-color: #3f3f46;
    color: #f4f4f5;
  }

  .icon-btn.hd {
    background: #18181b;
    border-color: #52525b;
    color: #e4e4e7;
  }

  .icon-btn.hd:hover {
    background: #27272a;
    border-color: #71717a;
    color: #fff;
  }

  .zoom-val {
    font-size: 11px;
    color: #71717a;
    font-family: 'JetBrains Mono', monospace;
    min-width: 40px;
    text-align: center;
  }

  .preview-area {
    flex: 1;
    overflow: auto;
    padding: 40px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  #output {
    max-width: 100%;
  }

  #output svg {
    border-radius: 8px;
    max-width: 100%;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
  }

  .error-box {
    background: #220a0a;
    border: 1px solid #451a1a;
    border-radius: 8px;
    padding: 16px 20px;
    color: #fca5a5;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.6;
    max-width: 500px;
  }

  .error-box .err-title {
    font-size: 13px;
    font-weight: 600;
    color: #ef4444;
    margin-bottom: 8px;
  }

  .placeholder-state {
    text-align: center;
    color: #52525b;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 80px 20px;
  }

  .placeholder-icon {
    font-size: 32px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .theme-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .theme-dot {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid #27272a;
    transition: all 0.15s ease;
  }

  .theme-dot:hover {
    border-color: #71717a;
    transform: translateY(-1px);
  }

  .theme-dot.active {
    border-color: #f4f4f5;
    box-shadow: 0 0 0 1px #f4f4f5;
    transform: scale(1.05);
  }

  .output-wrap {
    transform-origin: top center;
    transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
  }

  .kbd {
    display: inline-block;
    background: #18181b;
    border: 1px solid #27272a;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: #a1a1aa;
  }
</style>

<div id="app">
  <div class="header">
    <div class="header-logo">M</div>
    <div class="header-title">Mermaid Forge</div>
    <div class="header-badge">Dark Studio</div>
    <div style="flex:1"></div>
    <span class="kbd">⌘ + Enter</span>&nbsp;<span style="font-size:11px;color:#3a3869;">to render</span>
  </div>

  <div class="workspace">
    <div class="panel-left">
      <div class="panel-section">
        <div class="panel-label">Templates</div>
        <div class="template-grid"
             id="templates"></div>
      </div>

      <div class="panel-section">
        <div class="panel-label">Color Theme</div>
        <div class="theme-selector"
             id="themes"></div>
      </div>

      <div class="editor-wrap">
        <div class="panel-label">Diagram Source</div>
        <textarea id="editor"
                  spellcheck="false"></textarea>
        <div class="actions">
          <button class="btn-secondary"
                  onclick="copyCode()">Copy</button>
          <button class="btn-secondary"
                  onclick="clearEditor()">Clear</button>
          <button class="btn-primary"
                  onclick="renderDiagram()">▶ Render</button>
        </div>
      </div>
    </div>

    <div class="panel-right">
      <div class="preview-toolbar">
        <div class="preview-status">
          <div class="status-dot"
               id="statusDot"></div>
          <span class="status-text"
                id="statusText">ready</span>
        </div>
        <div class="zoom-controls">
          <div class="icon-btn"
               onclick="zoom(-0.15)">−</div>
          <div class="zoom-val"
               id="zoomVal">100%</div>
          <div class="icon-btn"
               onclick="zoom(0.15)">+</div>
          <div class="icon-btn"
               onclick="setZoom(1)">1:1</div>
          <div class="icon-btn"
               onclick="fitDiagram()">fit</div>
        </div>
        <div class="toolbar-actions">
          <div class="icon-btn"
               onclick="downloadSVG()">↓ SVG</div>
          <div class="icon-btn"
               onclick="downloadPNG()">↓ PNG</div>
          <div class="icon-btn hd"
               onclick="downloadHDPNG()">↓ HD PNG</div>
        </div>
      </div>
      <div class="preview-area"
           id="previewArea">
        <div class="output-wrap"
             id="outputWrap">
          <div id="output">
            <div class="placeholder-state">
              <div class="placeholder-icon">◈</div>
              <div>Select a template or write Mermaid syntax</div>
              <div style="margin-top:8px;color:#1e1c40;font-size:11px;">Press ▶ Render to generate diagram</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CHANGED: Pinned to exact version 11.4.1 which has full Architecture Diagram support -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  const THEMES = [
    { name: 'Graphite', primary: '#d4d4d8', bg: '#09090b', node: '#18181b', text: '#f4f4f5', border: '#3f3f46', edge: '#71717a', secondBg: '#121214', accent: '#ffffff' },
    { name: 'Cobalt', primary: '#3b82f6', bg: '#060a16', node: '#0f172a', text: '#e0f2fe', border: '#1e3a8a', edge: '#3b82f6', secondBg: '#0b1120', accent: '#60a5fa' },
    { name: 'Nordic', primary: '#88c0d0', bg: '#242933', node: '#2e3440', text: '#eceff4', border: '#4c566a', edge: '#81a1c1', secondBg: '#2a303c', accent: '#8fbcbb' },
    { name: 'Forest', primary: '#10b981', bg: '#050f0c', node: '#0a1c16', text: '#d1fae5', border: '#133d2f', edge: '#059669', secondBg: '#071611', accent: '#34d399' },
    { name: 'Amethyst', primary: '#8b5cf6', bg: '#0d0315', node: '#1a0b26', text: '#e9d5ff', border: '#3b1a57', edge: '#7c3aed', secondBg: '#14061f', accent: '#a78bfa' },
    { name: 'Mocha', primary: '#d6d3d1', bg: '#1c1917', node: '#292524', text: '#f5f5f4', border: '#44403c', edge: '#a8a29e', secondBg: '#221f1d', accent: '#e7e5e4' },
  ];

  const TEMPLATES = [
    {
      name: 'System Architecture', type: 'architecture-beta', code: `architecture-beta
    group backend(server)[Backend Single Process]
    group exec(server)[Execution Engine] in backend
    group db(database)[Persistence]

    service browser(internet)[React SPA]
    service api(server)[FastAPI] in backend
    service botmgr(server)[BotInstanceManager] in backend
    service ir(server)[InstanceRunners] in backend
    service strat(server)[Lorentzian Strategy] in backend
    service sigmem(database)[Signal Database] in backend
    service lfm(server)[LiveFeedManager] in backend
    service streams(server)[Tick Streams] in backend
    service tick(server)[TickFetcher] in backend
    service wd(server)[Unified Watchdog] in backend

    service dclient(server)[DeltaClient] in exec
    service strike(server)[StrikeSelector] in exec
    service order(server)[OrderExecutor] in exec

    service json(disk)[bots json] in db
    service sigdb(database)[signals db] in db
    service trddb(database)[trades db] in db

    service extapi(cloud)[Delta Exchange]

    browser:R <--> L:api
    api:R --> L:botmgr
    botmgr:R <--> L:json

    botmgr:B --> T:ir
    ir:B --> T:strat
    strat:B --> T:sigmem
    sigmem:R <--> L:sigdb

    wd:T --> B:lfm
    lfm:L --> R:tick
    lfm:T --> B:streams

    wd:B --> T:dclient
    dclient:R --> L:strike
    strike:R --> L:order

    wd:R --> L:sigmem
    
    %% FIX 1: Push trddb to the Right side (next to sigdb) so the "db" group 
    %% stays together in one neat column instead of stretching across the screen
    sigdb:R --> L:trddb
    wd:R --> L:trddb

    %% FIX 2: Route tick out its Left port so it travels down the empty exterior
    %% instead of crashing vertically through the backend groups
    dclient:B <--> T:extapi
    tick:L <--> L:extapi` },
    {
      name: 'Flowchart', type: 'graph', code: `flowchart TD
    A([Start]) --> B{Input Valid?}
    B -->|Yes| C[Process Data]
    B -->|No| D[Show Error]
    C --> E[Transform]
    E --> F[Validate]
    F -->|Pass| G([Success])
    F -->|Fail| H[Retry]
    H --> C
    D --> A` },
    {
      name: 'Sequence', type: 'sequence', code: `sequenceDiagram
    participant C as Client
    participant G as Gateway
    participant S as Service
    participant D as Database
    C->>+G: POST /api/request
    G->>+S: Forward Request
    S->>+D: Query Data
    D-->>-S: Result Set
    S-->>-G: JSON Response
    G-->>-C: 200 OK` },
    {
      name: 'Class Diagram', type: 'classDiagram', code: `classDiagram
    class BaseModel {
        +String id
        +DateTime createdAt
        +save()
        +delete()
    }
    class User {
        +String email
        +String name
        +authenticate()
        +getProfile()
    }
    class Project {
        +String title
        +String status
        +List~Task~ tasks
        +addTask()
    }
    class Task {
        +String title
        +Boolean done
        +complete()
    }
    BaseModel <|-- User
    BaseModel <|-- Project
    Project "1" *-- "many" Task
    User "1" --> "many" Project` },
    {
      name: 'ERD', type: 'erDiagram', code: `erDiagram
    USER {
        uuid id PK
        string email UK
        string name
        timestamp created_at
    }
    PROJECT {
        uuid id PK
        string title
        string status
        uuid owner_id FK
    }
    TASK {
        uuid id PK
        string title
        boolean completed
        uuid project_id FK
    }
    USER ||--o{ PROJECT : owns
    PROJECT ||--o{ TASK : contains` },
    {
      name: 'Git Graph', type: 'gitGraph', code: `gitGraph
    commit id: "init"
    commit id: "setup"
    branch develop
    checkout develop
    commit id: "feat/auth"
    commit id: "feat/api"
    branch feature/ui
    checkout feature/ui
    commit id: "components"
    commit id: "styling"
    checkout develop
    merge feature/ui id: "merge-ui"
    commit id: "tests"
    checkout main
    merge develop id: "v1.0.0" tag: "release"` },
  ];

  const THEME_COLORS = ['#71717a', '#3b82f6', '#88c0d0', '#10b981', '#8b5cf6', '#a8a29e'];

  let currentTheme = 0;
  let zoomLevel = 1;
  let renderCount = 0;

  function buildThemes() {
    const cont = document.getElementById('themes');
    THEMES.forEach((t, i) => {
      const d = document.createElement('div');
      d.className = 'theme-dot' + (i === 0 ? ' active' : '');
      d.style.background = THEME_COLORS[i];
      d.title = t.name;
      d.onclick = () => {
        document.querySelectorAll('.theme-dot').forEach(x => x.classList.remove('active'));
        d.classList.add('active');
        currentTheme = i;
        if (document.getElementById('output').querySelector('svg')) renderDiagram();
      };
      cont.appendChild(d);
    });
  }

  function buildTemplates() {
    const cont = document.getElementById('templates');
    TEMPLATES.forEach((t, i) => {
      const btn = document.createElement('div');
      btn.className = 'tpl-btn';
      btn.innerHTML = `<div class="tpl-name">${t.name}</div><div class="tpl-type">${t.type}</div>`;
      btn.onclick = () => {
        document.querySelectorAll('.tpl-btn').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('editor').value = t.code;
        renderDiagram();
      };
      cont.appendChild(btn);
    });
  }

  function getMermaidConfig(themeIdx) {
    const t = THEMES[themeIdx];
    return {
      theme: 'base',
      themeVariables: {
        primaryColor: t.node,
        primaryTextColor: t.text,
        primaryBorderColor: t.border,
        lineColor: t.edge,
        secondaryColor: t.secondBg,
        tertiaryColor: t.bg,
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: '13px',
        nodeBorder: t.border,
        mainBkg: t.node,
        clusterBkg: t.secondBg,
        clusterBorder: t.border,
        titleColor: t.text,
        edgeLabelBackground: t.bg,
        nodeTextColor: t.text,
        actorBkg: t.node,
        actorBorder: t.primary,
        actorLineColor: t.edge,
        actorTextColor: t.text,
        signalColor: t.text,
        signalTextColor: t.text,
        labelBoxBkgColor: t.node,
        labelBoxBorderColor: t.primary,
        labelTextColor: t.text,
        loopTextColor: t.text,
        noteBkgColor: t.node,
        noteTextColor: t.text,
        noteBorderColor: t.accent,
        activationBkgColor: t.secondBg,
        activationBorderColor: t.primary,
        sequenceNumberColor: t.primary,
        fillType0: t.node,
        fillType1: t.secondBg,
        git0: t.primary,
        git1: t.accent,
        git2: '#22d3ee',
        git3: '#f97316',
        gitBranchLabel0: t.text,
        gitBranchLabel1: t.text,
        commitLabelColor: t.text,
        commitLabelBackground: t.node,
        tagLabelColor: t.text,
        tagLabelBackground: t.accent,
        tagLabelBorder: t.accent,
        classText: t.text,
        attributeBackgroundColorEven: t.node,
        attributeBackgroundColorOdd: t.secondBg,
        pie1: t.primary,
        pie2: t.accent,
        pie3: '#22d3ee',
        pie4: '#f97316',
        pieSectionTextColor: t.text,
        pieLegendTextColor: t.text,
        pieTitleTextColor: t.text,
        taskBkgColor: t.node,
        taskBorderColor: t.border,
        taskTextColor: t.text,
        taskTextLightColor: t.text,
        taskTextOutsideColor: t.text,
        activeTaskBkgColor: t.primary,
        activeTaskBorderColor: t.accent,
        doneTaskBkgColor: t.secondBg,
        doneTaskBorderColor: t.border,
        critBkgColor: '#3d0a0a',
        critBorderColor: '#ef4444',
        critTextColor: '#ffd0d0',
        gridColor: t.edge,
        todayLineColor: t.accent,
        sectionBkgColor: t.secondBg,
        altSectionBkgColor: t.bg,
        sectionBkgColor2: t.node,
        excludeBkgColor: t.bg,
        taskTextDarkColor: t.text,
      }
    };
  }

  function setStatus(state, msg) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    dot.className = 'status-dot' + (state === 'error' ? ' error' : state === 'loading' ? ' loading' : '');
    txt.textContent = msg;
  }

  async function renderDiagram() {
    const code = document.getElementById('editor').value.trim();
    if (!code) return;

    setStatus('loading', 'rendering...');
    const output = document.getElementById('output');

    try {
      const cfg = getMermaidConfig(currentTheme);
      mermaid.initialize({ startOnLoad: false, ...cfg, securityLevel: 'loose' });

      const id = 'mermaid-' + (++renderCount);
      const { svg } = await mermaid.render(id, code);

      const t = THEMES[currentTheme];
      const wrapped = `<div style="background:${t.bg};padding:28px 36px;border-radius:14px;border:1px solid ${t.border};display:inline-block;min-width:400px;">${svg}</div>`;
      output.innerHTML = wrapped;

      const svgEl = output.querySelector('svg');
      if (svgEl) {
        svgEl.style.maxWidth = '100%';
        svgEl.style.background = 'transparent';
        svgEl.style.fontFamily = "'JetBrains Mono', monospace";
      }

      setStatus('ok', `rendered · ${code.split('\n').length} lines`);
    } catch (e) {
      output.innerHTML = `<div class="error-box"><div class="err-title">Syntax Error</div>${e.message || e}</div>`;
      setStatus('error', 'parse error');
    }
  }

  function zoom(delta) {
    zoomLevel = Math.max(0.3, Math.min(3, zoomLevel + delta));
    applyZoom();
  }

  function setZoom(v) {
    zoomLevel = v;
    applyZoom();
  }

  function applyZoom() {
    document.getElementById('outputWrap').style.transform = `scale(${zoomLevel})`;
    document.getElementById('zoomVal').textContent = Math.round(zoomLevel * 100) + '%';
  }

  function fitDiagram() {
    const area = document.getElementById('previewArea');
    const wrap = document.getElementById('outputWrap');
    const child = document.getElementById('output').firstChild;
    if (!child) return;
    const aW = area.clientWidth - 64;
    const aH = area.clientHeight - 64;
    const cW = child.offsetWidth || 600;
    const cH = child.offsetHeight || 400;
    zoomLevel = Math.min(aW / cW, aH / cH, 1);
    applyZoom();
  }

  function clearEditor() {
    document.getElementById('editor').value = '';
    document.getElementById('output').innerHTML = `<div class="placeholder-state"><div class="placeholder-icon">◈</div><div>Select a template or write Mermaid syntax</div></div>`;
    setStatus('ok', 'ready');
    document.querySelectorAll('.tpl-btn').forEach(x => x.classList.remove('active'));
  }

  function copyCode() {
    navigator.clipboard.writeText(document.getElementById('editor').value);
  }

  function downloadSVG() {
    const svg = document.getElementById('output').querySelector('svg');
    if (!svg) return;
    const t = THEMES[currentTheme];
    const full = `<svg xmlns="http://www.w3.org/2000/svg" style="background:${t.bg}">${svg.innerHTML}</svg>`;
    const blob = new Blob([full], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'diagram.svg';
    a.click();
  }

  function downloadPNG() {
    const svg = document.getElementById('output').querySelector('svg');
    if (!svg) return;
    const t = THEMES[currentTheme];
    const w = svg.clientWidth || 1920;
    const h = svg.clientHeight || 1080;
    const canvas = document.createElement('canvas');
    canvas.width = w * 2; canvas.height = h * 2;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = t.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const img = new Image();
    const data = new XMLSerializer().serializeToString(svg);
    const blob = new Blob([data], { type: 'image/svg+xml' });
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = 'diagram.png';
      a.click();
    };
    img.src = URL.createObjectURL(blob);
  }

  function downloadHDPNG() {
    const svg = document.getElementById('output').querySelector('svg');
    if (!svg) return;

    const t = THEMES[currentTheme];
    const viewBox = svg.getAttribute('viewBox');
    let origW = 800, origH = 600;
    if (viewBox) {
      const parts = viewBox.split(' ');
      origW = parseFloat(parts[2]);
      origH = parseFloat(parts[3]);
    } else {
      const rect = svg.getBoundingClientRect();
      origW = rect.width || 800;
      origH = rect.height || 600;
    }

    // 1. Scale up for crisp resolution
    const scale = Math.max(1920 / origW, 1080 / origH, 2);
    const drawW = origW * scale;
    const drawH = origH * scale;

    // 2. Add 10% breathing room (5% padding on all sides)
    const paddedW = drawW * 1.1;
    const paddedH = drawH * 1.1;

    // 3. Force 16:9 Ratio logic
    const targetRatio = 16 / 9;
    let finalW, finalH;

    if (paddedW / paddedH > targetRatio) {
      // Content is wider than 16:9: Lock width, expand height
      finalW = Math.max(paddedW, 1920);
      finalH = finalW / targetRatio;
    } else {
      // Content is taller than 16:9: Lock height, expand width
      finalH = Math.max(paddedH, 1080);
      finalW = finalH * targetRatio;
    }

    // 4. Setup Canvas
    const canvas = document.createElement('canvas');
    canvas.width = finalW;
    canvas.height = finalH;

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = t.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 5. Clone and size SVG strictly to its drawing size
    const clonedSvg = svg.cloneNode(true);
    clonedSvg.setAttribute('width', drawW);
    clonedSvg.setAttribute('height', drawH);
    clonedSvg.style.background = 'transparent';

    const data = new XMLSerializer().serializeToString(clonedSvg);
    const svgBlob = new Blob([data], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    const img = new Image();
    img.onload = () => {
      // 6. Draw perfectly centered on the 16:9 canvas
      const offsetX = (finalW - drawW) / 2;
      const offsetY = (finalH - drawH) / 2;
      ctx.drawImage(img, offsetX, offsetY, drawW, drawH);

      URL.revokeObjectURL(url);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png', 1.0);
      a.download = 'diagram-16x9-hd.png';
      a.click();
    };
    img.src = url;
  }

  document.getElementById('editor').addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      renderDiagram();
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = e.target.selectionStart;
      const v = e.target.value;
      e.target.value = v.slice(0, s) + '  ' + v.slice(e.target.selectionEnd);
      e.target.selectionStart = e.target.selectionEnd = s + 2;
    }
  });

  buildThemes();
  buildTemplates();

  setTimeout(() => {
    document.getElementById('editor').value = TEMPLATES[0].code;
    document.querySelectorAll('.tpl-btn')[0].classList.add('active');
    renderDiagram();
  }, 500);
</script>
